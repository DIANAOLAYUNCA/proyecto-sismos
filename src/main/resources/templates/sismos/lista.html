<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sismos | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Sistema de sismos</span>
        <h1>Lista de sismos</h1>
    </header>
    <nav class="acciones">
        <a class="boton" th:href="@{/eventos/nuevo}">Nuevo sismo</a>
    </nav>
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></div>
    <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>
    <section class="tarjeta">
        <form method="get" th:action="@{/eventos}" class="filtro">
            <label>Código
                <input name="codigo" th:value="${codigoBuscado}" placeholder="Ej. SIS-2026-0001">
            </label>
            <label>Fecha
                <input name="fecha" type="date" th:value="${fechaSeleccionada}">
            </label>
            <label>Magnitud mínima
                <input name="magnitudMinima" type="number" step="0.1" min="0" th:value="${magnitudMinima}" placeholder="Ej. 4.0">
            </label>
            <label>Estado
                <select name="estado">
                    <option value="">Todos</option>
                    <option value="REGISTRADO" th:selected="${estadoSeleccionado == 'REGISTRADO'}">REGISTRADO</option>
                    <option value="EN_EVALUACION" th:selected="${estadoSeleccionado == 'EN_EVALUACION'}">EN_EVALUACION</option>
                    <option value="EN_SEGUIMIENTO" th:selected="${estadoSeleccionado == 'EN_SEGUIMIENTO'}">EN_SEGUIMIENTO</option>
                    <option value="CERRADO" th:selected="${estadoSeleccionado == 'CERRADO'}">CERRADO</option>  
                    <option value="INACTIVO" th:selected="${estadoSeleccionado == 'INACTIVO'}">INACTIVO</option>                    <option value="INACTIVO" th:selected="${estadoSeleccionado == 'INACTIVO'}">INACTIVO</option>
                </select>
            </label>
            <label>Ubicación
                <select name="ubicacionId">
                    <option value="">Todas</option>
                    <option th:each="u : ${ubicaciones}" th:value="${u.id}" th:text="${u.codigo + ' - ' + u.nombre}" th:selected="${u.id == ubicacionSeleccionada}"></option>
                </select>
            </label>
            <button type="submit">Filtrar</button>
            <a th:href="@{/eventos}">Limpiar</a>
        </form>
    </section>
    <section class="tarjeta">
        <h2>Sismos encontrados: <span th:text="${#lists.size(eventos)}">0</span></h2>
        <div class="tabla-scroll">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Código</th><th>Fecha</th><th>Magnitud</th><th>Profundidad</th>
                        <th>Ubicación</th><th>Alerta</th><th>Estado</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(eventos)}">
                        <td colspan="9" class="vacio">No se encontraron sismos.</td>
                    </tr>
                    <tr th:each="evento : ${eventos}">
                        <td th:text="${evento.id}"></td>
                        <td th:text="${evento.codigo}"></td>
                        <td th:text="${evento.fechaHora}"></td>
                        <td th:text="${evento.magnitud}"></td>
                        <td th:text="${evento.profundidad}"></td>
                        <td th:text="${evento.ubicacion.nombre}"></td>
                        <td th:text="${evento.tipoAlerta.nombre}"></td>
                        <td th:text="${evento.estado}"></td>
                        <td class="acciones-tabla">
                            <a th:href="@{/eventos/{id}(id=${evento.id})}">Ver</a>
                            <a th:href="@{/eventos/{id}/editar(id=${evento.id})}">Editar</a>
                            <a class="enlace-peligro" th:if="${evento.estado != 'INACTIVO'}" th:href="@{/eventos/{id}/eliminar(id=${evento.id})}">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>

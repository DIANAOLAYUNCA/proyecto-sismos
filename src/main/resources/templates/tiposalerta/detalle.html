<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de tipo de alerta | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Sistema de sismos</span>
        <h1>Detalle del tipo de alerta</h1>
    </header>
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></div>
    <section class="tarjeta detalle">
        <dl>
            <div><dt>ID</dt><dd th:text="${tipoAlerta.id}"></dd></div>
            <div><dt>Código</dt><dd th:text="${tipoAlerta.codigo}"></dd></div>
            <div><dt>Nombre</dt><dd th:text="${tipoAlerta.nombre}"></dd></div>
            <div><dt>Color</dt><dd th:text="${tipoAlerta.color}"></dd></div>
            <div><dt>Prioridad</dt><dd th:text="${tipoAlerta.prioridad}"></dd></div>
            <div><dt>Descripción</dt><dd th:text="${tipoAlerta.descripcion}"></dd></div>
            <div><dt>Estado</dt><dd th:text="${tipoAlerta.estado}"></dd></div>
            <div><dt>Fecha de creación</dt><dd th:text="${tipoAlerta.creacionFecha}"></dd></div>
            <div><dt>Usuario de creación</dt><dd th:text="${tipoAlerta.creacionUsuario}"></dd></div>
            <div><dt>Fecha de actualización</dt><dd th:text="${tipoAlerta.actualizacionFecha}"></dd></div>
            <div><dt>Usuario de actualización</dt><dd th:text="${tipoAlerta.actualizacionUsuario}"></dd></div>
        </dl>
    </section>
    <nav class="acciones">
        <a class="boton" th:href="@{/tipos-alerta/{id}/editar(id=${tipoAlerta.id})}">Editar</a>
        <a class="enlace-peligro" th:if="${tipoAlerta.estado == 'ACTIVO'}" th:href="@{/tipos-alerta/{id}/eliminar(id=${tipoAlerta.id})}">Eliminar</a>
        <a th:href="@{/tipos-alerta}">Volver a la lista</a>
    </nav>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de daño | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Tabla maestra - </span>
        <span class="module-tag">Catálogo precargado</span>
        <h1>Lista de tipos de daño</h1>
    </header>
    
<!--    <nav class="acciones">
        <a class="boton" th:href="@{/tipos-dano/nuevo}">Nuevo tipo de daño</a>
    </nav>-->
    
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></div>
    <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>
    
    <section class="tarjeta">
        <h2>Tipos de daño precargados: <span th:text="${#lists.size(tipos)}">0</span></h2>
        <div class="tabla-scroll">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Sector</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(tipos)}">
                        <td colspan="6" class="vacio">No se encontraron tipos de daño.</td>
                    </tr>
                    <tr th:each="tipo : ${tipos}">
                        <td th:text="${tipo.id}"></td>
                        <td th:text="${tipo.codigo}"></td>
                        <td th:text="${tipo.nombre}"></td>
                        <td th:text="${tipo.sector}"></td>
                        <td th:text="${tipo.estado}"></td>
                        <td class="acciones-tabla">
                            <a class="accion-ver" th:href="@{/tipos-dano/{id}(id=${tipo.id})}" title="Ver detalle">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <span>Ver</span>
                            </a>
                            
                            <a class="accion-editar" th:href="@{/tipos-dano/{id}/editar(id=${tipo.id})}" title="Editar registro">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                                <span>Editar</span>
                            </a>
                            
                            <a class="enlace-peligro" th:if="${tipo.estado == 'ACTIVO'}" th:href="@{/tipos-dano/{id}/eliminar(id=${tipo.id})}" title="Eliminar registro">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                                <span>Eliminar</span>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estaciones | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Sistema de sismos</span>
        <h1>Lista de estaciones</h1>
    </header>
    
    <nav class="acciones">
        <a class="boton" th:href="@{/estaciones/nuevo}" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>Nueva estación</span>
        </a>
    </nav>
    
    
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></div>
    <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>
    <section class="tarjeta">
        <form method="get" th:action="@{/estaciones}" class="filtro">
            <label>Buscar
                <input type="search" name="q" th:value="${textoBuscado}" maxlength="100" placeholder="Código o nombre">
            </label>
            <label>Estado
                <select name="estado">
                    <option value="">Todos</option>
                    <option value="ACTIVA" th:selected="${estadoSeleccionado == 'ACTIVA'}">ACTIVA</option>
                    <option value="INACTIVA" th:selected="${estadoSeleccionado == 'INACTIVA'}">INACTIVA</option>
                </select>
            </label>
            <label>Ubicación
                <select name="ubicacionId">
                    <option value="">Todas</option>
                    <option th:each="u : ${ubicaciones}" th:value="${u.id}" th:text="${u.codigo + ' - ' + u.nombre}" th:selected="${u.id == ubicacionSeleccionada}"></option>
                </select>
            </label>
            <input type="hidden" name="tamano" th:value="${pagina.tamano}">
            <input type="hidden" name="orden" th:value="${pagina.orden}">
            <input type="hidden" name="dir" th:value="${pagina.dir}">
            <button type="submit">Buscar</button>
            <a th:href="@{/estaciones}">Limpiar</a>
        </form>
    </section>

    <section class="tarjeta">
        <h2>Estaciones encontradas: <span th:text="${pagina.totalElementos}">0</span></h2>
        <div class="tabla-scroll">
            <table>
                <thead>
                    <tr>
                        <th><a class="orden" th:href="${pagina.urlOrden('id')}">ID <span th:text="${pagina.flecha('id')}"></span></a></th>
                        <th><a class="orden" th:href="${pagina.urlOrden('codigo')}">Código <span th:text="${pagina.flecha('codigo')}"></span></a></th>
                        <th><a class="orden" th:href="${pagina.urlOrden('nombre')}">Nombre <span th:text="${pagina.flecha('nombre')}"></span></a></th>
                        <th><a class="orden" th:href="${pagina.urlOrden('ubicacion')}">Ubicación <span th:text="${pagina.flecha('ubicacion')}"></span></a></th>
                        <th><a class="orden" th:href="${pagina.urlOrden('distrito')}">Distrito <span th:text="${pagina.flecha('distrito')}"></span></a></th>
                        <th>Latitud</th>
                        <th>Longitud</th>
                        <th><a class="orden" th:href="${pagina.urlOrden('estado')}">Estado <span th:text="${pagina.flecha('estado')}"></span></a></th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pagina.items)}">
                        <td colspan="9" class="vacio">No se encontraron estaciones.</td>
                    </tr>
                    <tr th:each="estacion : ${pagina.items}">
                        <td th:text="${estacion.id}"></td>
                        <td th:text="${estacion.codigo}"></td>
                        <td th:text="${estacion.nombre}"></td>
                        <td th:text="${estacion.ubicacion.nombre}"></td>
                        <td th:text="${estacion.distrito != null ? estacion.distrito.nombre : '—'}"></td>
                        <td th:text="${estacion.latitud}"></td>
                        <td th:text="${estacion.longitud}"></td>
                        <td th:text="${estacion.estado}"></td>
                        <td class="acciones-tabla">
                            <a class="accion-ver" th:href="@{/estaciones/{id}(id=${estacion.id})}" title="Ver detalle">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <span>Ver</span>
                            </a>
                            
                            <a class="accion-editar" th:href="@{/estaciones/{id}/editar(id=${estacion.id})}" title="Editar registro">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                                <span>Editar</span>
                            </a>
                            
                            <a class="enlace-peligro" th:if="${estacion.estado == 'ACTIVA'}" th:href="@{/estaciones/{id}/eliminar(id=${estacion.id})}" title="Eliminar registro">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                                <span>Eliminar</span>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/paginacion :: barra(${pagina})}"></div>
    </section>
</main>
</body>
</html>

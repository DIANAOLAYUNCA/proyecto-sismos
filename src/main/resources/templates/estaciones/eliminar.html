<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar de baja estación | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Sistema de sismos</span>
        <h1>Confirmar baja</h1>
    </header>
    <section class="tarjeta">
        <p>¿Desea dar de baja la estación <strong th:text="${estacion.nombre}"></strong> (<span th:text="${estacion.codigo}"></span>)?</p>
        <p class="nota">La estación pasará a estado INACTIVA, dejará de mostrarse en el listado y no estará disponible para registrar nuevos sismos.</p>
        <form method="post" th:action="@{/estaciones/{id}/eliminar(id=${estacion.id})}" class="acciones">
            <button class="boton-peligro" type="submit">Confirmar baja</button>
            <a th:href="@{/estaciones}">Cancelar</a>
        </form>
    </section>
</main>
</body>
</html>

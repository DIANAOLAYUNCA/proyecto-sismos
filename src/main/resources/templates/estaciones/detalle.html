<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de estación | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Sistema de sismos</span>
        <h1>Detalle de la estación</h1>
    </header>
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></div>
    <section class="tarjeta detalle">
        <dl>
            <div><dt>ID</dt><dd th:text="${estacion.id}"></dd></div>
            <div><dt>Código</dt><dd th:text="${estacion.codigo}"></dd></div>
            <div><dt>Nombre</dt><dd th:text="${estacion.nombre}"></dd></div>
            <div><dt>Ubicación</dt><dd th:text="${estacion.ubicacion.codigo + ' - ' + estacion.ubicacion.nombre}"></dd></div>
            <div><dt>Latitud</dt><dd th:text="${estacion.latitud}"></dd></div>
            <div><dt>Longitud</dt><dd th:text="${estacion.longitud}"></dd></div>
            <div><dt>Fecha de instalación</dt><dd th:text="${estacion.instalacionFecha}"></dd></div>
            <div><dt>Estado</dt><dd th:text="${estacion.estado}"></dd></div>
            <div><dt>Fecha de creación</dt><dd th:text="${estacion.creacionFecha}"></dd></div>
            <div><dt>Usuario de creación</dt><dd th:text="${estacion.creacionUsuario}"></dd></div>
            <div><dt>Fecha de actualización</dt><dd th:text="${estacion.actualizacionFecha}"></dd></div>
            <div><dt>Usuario de actualización</dt><dd th:text="${estacion.actualizacionUsuario}"></dd></div>
        </dl>
    </section>
    <nav class="acciones">
        <a class="boton" th:href="@{/estaciones/{id}/editar(id=${estacion.id})}">Editar</a>
        <a class="enlace-peligro" th:if="${estacion.estado == 'ACTIVA'}" th:href="@{/estaciones/{id}/eliminar(id=${estacion.id})}">Eliminar</a>
        <a th:href="@{/estaciones}">Volver a la lista</a>
    </nav>
</main>
</body>
</html>

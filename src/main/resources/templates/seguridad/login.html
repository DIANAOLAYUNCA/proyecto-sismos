<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Ingresar | CSSP Sismos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </head>
    <body class="d-flex align-items-center min-vh-100 bg-light">
      <main class="container">
        <div class="row justify-content-center">
          <div class="col-sm-9 col-md-6 col-lg-4">
            <section class="card shadow border-0">
              <div class="card-body p-4">
                <p class="text-muted small mb-1">CSSP Sismos v2.0</p>
                <h1 class="h3 mb-4">Iniciar sesión</h1>

                <div class="alert alert-danger" th:if="${param.error}">
                  Usuario o contraseña incorrectos.
                </div>
                <div class="alert alert-success" th:if="${param.logout}">
                  La sesión se cerró correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                  <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                  </div>
                  <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                  </div>
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button class="btn btn-primary w-100" type="submit">Ingresar al sistema</button>
                </form>

                <p class="small text-secondary mt-4 mb-0">
                  Cuenta de prueba: <code>aramirez</code> / <code>123456</code>. Cámbiela antes de cualquier despliegue real.
                </p>
              </div>
            </section>
          </div>
        </div>
      </main>
    </body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Recurso no encontrado</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
    <style>
        .error-404-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .error-404-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 520px;
            width: 100%;
            padding: 2.75rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-404-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ef4444, #f97316, #ef4444);
        }

        .seismic-graphic {
            width: 120px;
            height: 60px;
            margin: 0 auto 1rem;
        }

        .seismic-line {
            fill: none;
            stroke: #ef4444;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            animation: pulseWave 2.5s ease-in-out infinite;
        }

        @keyframes pulseWave {
            0% {
                stroke-dashoffset: 220;
                opacity: 0.4;
            }
            50% {
                stroke-dashoffset: 0;
                opacity: 1;
            }
            100% {
                stroke-dashoffset: -220;
                opacity: 0.4;
            }
        }

        .error-code {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, #1e293b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .error-subtitle {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0.75rem 0 0.5rem;
        }

        .error-message {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            background: #f8fafc;
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
        }

        .error-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary-sismos {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #ef4444;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.8rem 1.6rem;
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-primary-sismos:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        }

        .btn-secondary-back {
            display: inline-flex;
            align-items: center;
            background-color: #f1f5f9;
            color: #334155;
            text-decoration: none;
            font-weight: 600;
            padding: 0.8rem 1.4rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }

        .btn-secondary-back:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="contenedor error-404-wrapper">
        <section class="error-404-card">
            <!-- Ilustración SVG animada de onda sísmica -->
            <svg class="seismic-graphic" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polyline class="seismic-line" points="0,30 25,30 33,18 42,45 52,6 62,54 72,22 80,35 88,30 120,30" />
            </svg>

            <h1 class="error-code">404</h1>
            <h2 class="error-subtitle">¡Sin registro en el epicentro!</h2>

            <!-- Mensaje dinámico de Thymeleaf con respaldo por defecto -->
            <p class="error-message" th:text="${mensaje != null ? mensaje : 'El registro o ruta que buscas no existe o fue movido.'}">
                Recurso no encontrado.
            </p>

            <div class="error-actions">
                <a th:href="@{/eventos}" class="btn-primary-sismos">
                    <span>📡</span> Ir a sismos
                </a>
                <button type="button" onclick="history.back()" class="btn-secondary-back">
                    Volver atrás
                </button>
            </div>
        </section>
    </main>
</body>
</html>

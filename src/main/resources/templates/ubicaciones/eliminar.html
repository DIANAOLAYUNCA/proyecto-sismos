<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar ubicación | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Sistema de sismos</span>
        <h1>Confirmar eliminación</h1>
    </header>
    <section class="tarjeta">
        <p>¿Desea eliminar la ubicación <strong th:text="${ubicacion.nombre}"></strong> (<span th:text="${ubicacion.codigo}"></span>)?</p>
        <p class="nota">La ubicación pasará a estado INACTIVO, dejará de mostrarse en el listado y no estará disponible para nuevas estaciones ni sismos.</p>
        <form method="post" th:action="@{/ubicaciones/{id}/eliminar(id=${ubicacion.id})}" class="acciones">
            <button class="boton-peligro" type="submit">Confirmar eliminación</button>
            <a th:href="@{/ubicaciones}">Cancelar</a>
        </form>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de ubicación | CSSP</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="contenedor">
    <header>
        <span class="version">Sistema de sismos</span>
        <h1>Detalle de la ubicación</h1>
    </header>
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></div>
    <section class="tarjeta detalle">
        <dl>
            <div><dt>ID</dt><dd th:text="${ubicacion.id}"></dd></div>
            <div><dt>Código</dt><dd th:text="${ubicacion.codigo}"></dd></div>
            <div><dt>Nombre</dt><dd th:text="${ubicacion.nombre}"></dd></div>
            <div><dt>Tipo</dt><dd th:text="${ubicacion.tipo}"></dd></div>
            <div><dt>Estado</dt><dd th:text="${ubicacion.estado}"></dd></div>
            <div><dt>Fecha de creación</dt><dd th:text="${ubicacion.creacionFecha}"></dd></div>
            <div><dt>Usuario de creación</dt><dd th:text="${ubicacion.creacionUsuario}"></dd></div>
            <div><dt>Fecha de actualización</dt><dd th:text="${ubicacion.actualizacionFecha}"></dd></div>
            <div><dt>Usuario de actualización</dt><dd th:text="${ubicacion.actualizacionUsuario}"></dd></div>
        </dl>
    </section>
    <nav class="acciones">
        <a class="boton" th:href="@{/ubicaciones/{id}/editar(id=${ubicacion.id})}">Editar</a>
        <a class="enlace-peligro" th:if="${ubicacion.estado == 'ACTIVO'}" th:href="@{/ubicaciones/{id}/eliminar(id=${ubicacion.id})}">Eliminar</a>
        <a th:href="@{/ubicaciones}">Volver a la lista</a>
    </nav>
</main>
</body>
</html>
